<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تراث ← Word</title>

<style>
body {
  font-family: sans-serif;
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
  line-height: 1.8;
}
button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
}
#status {
  margin-top: 20px;
  white-space: pre-wrap;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>

<body>

<h1>تراث ← Word</h1>
<p>Parser v4 — بنية تراث وحفظ مواضع الصفحات.</p>


<div style="margin:24px 0">
  <label for="bookUrl" style="display:block;margin-bottom:10px">
    رابط الكتاب في تراث
  </label>

  <input
    id="bookUrl"
    type="url"
    value="https://app.turath.io/book/6684"
    placeholder="https://app.turath.io/book/6684"
    dir="ltr"
    style="box-sizing:border-box;width:100%;padding:14px;font-size:16px;margin-bottom:12px"
  >

  <button id="make">إنشاء Word — أول 50 صفحة</button>
<button id="diagnose"
 style="margin-top:12px">
 تشخيص 50 صفحة
</button>
</div>

<hr style="margin:28px 0">

<div>
  <p>أو اختر ملف EPUB من جهازك:</p>
  <input
    id="epubInput"
    type="file"
    accept=".epub,application/epub+zip"
  >
</div>

<div id="status">جاهز.</div>

<script src="https://unpkg.com/docx@9.5.1/dist/index.umd.cjs"></script>

<script>
const statusEl = document.getElementById("status");
const PAGE_COUNT = 50;

function getBookId() {
  const value = document.getElementById("bookUrl").value.trim();
  const m = value.match(/\/book\/(\d+)/);
  if (m) return Number(m[1]);
  if (/^\d+$/.test(value)) return Number(value);
  throw new Error("رابط تراث غير صالح");
}

function cleanText(text) {
  return String(text || "")
    .replace(/\u00A0/g, " ")
    .replace(/[ \t]+/g, " ")
    .replace(/[ \t]*\n[ \t]*/g, "\n")
    .trim();
}

function isJunk(text) {
  const t = cleanText(text);
  if (!t) return true;
  if (t === "." || t === "ـ" || t === "ــ") return true;
  return /^[.\-ـ…•·_*=\s]{2,}$/.test(t);
}

function isNumberPrefix(text) {
  return /^[0-9٠-٩]+[\s\-–—ـ]*$/.test(cleanText(text));
}

function isStructuralPrefix(text) {
  let t = cleanText(text);
  if (!t || t.length > 60) return false;

  t = t.replace(/^[\s:؛،,.\-ـ]+|[\s:؛،,.\-ـ]+$/g, "");

  return t.length >= 3 &&
         t.startsWith("(") &&
         t.endsWith(")");
}

/* نفس قاعدة Golden التي أصلحت الصفحة الكثيفة */
function smartMerge(blocks) {
  const out = [];
  let i = 0;

  while (i < blocks.length) {
    const current = blocks[i];
    const text = cleanText(current.text);

    if (
      current.type !== "heading" &&
      isNumberPrefix(text) &&
      i + 2 < blocks.length &&
      blocks[i + 1].type !== "heading" &&
      isStructuralPrefix(blocks[i + 1].text)
    ) {
      out.push({
        type: "paragraph",
        text:
          text + " " +
          cleanText(blocks[i + 1].text) + " " +
          cleanText(blocks[i + 2].text)
      });

      i += 3;
      continue;
    }

    if (
      current.type !== "heading" &&
      isStructuralPrefix(text) &&
      i + 1 < blocks.length
    ) {
      out.push({
        type: "paragraph",
        text: text + " " + cleanText(blocks[i + 1].text)
      });

      i += 2;
      continue;
    }

    out.push(current);
    i++;
  }

  return out;
}

/*
  API تراث يعطينا HTML خفيفًا.
  نحافظ على title كعنوان، وما بين العناوين كنص.
  والأهم: لا نلحم صفحتين مختلفتين أبدًا.
*/
function parsePage(raw) {
  const meta =
    typeof raw.meta === "string"
      ? JSON.parse(raw.meta)
      : raw.meta;

  const parser = new DOMParser();

  const dom = parser.parseFromString(
    `<div id="root">${raw.text || ""}</div>`,
    "text/html"
  );

  const root = dom.getElementById("root");
  const blocks = [];
  let buffer = "";

  function flush() {
    const text = cleanText(buffer);
    buffer = "";

    if (!isJunk(text)) {
      /*
        نحافظ على أسطر المصدر كفقرات عندما تكون موجودة،
        بدل فقرة عملاقة واحدة.
      */
      const parts = text
        .split(/\n+/)
        .map(cleanText)
        .filter(x => !isJunk(x));

      for (const part of parts) {
        blocks.push({
          type: "paragraph",
          text: part
        });
      }
    }
  }

  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      buffer += node.textContent || "";
      return;
    }

    if (node.nodeType !== Node.ELEMENT_NODE) return;

    const tag = node.tagName.toLowerCase();

    if (
      /^h[1-6]$/.test(tag) ||
      node.getAttribute("data-type") === "title"
    ) {
      flush();

      const text = cleanText(node.textContent);

      if (!isJunk(text)) {
        blocks.push({
          type: "heading",
          text
        });
      }
      return;
    }

    if (tag === "br") {
      buffer += "\n";
      return;
    }

    for (const child of node.childNodes) {
      walk(child);
    }
  }

  for (const child of root.childNodes) {
    walk(child);
  }

  flush();

  return {
    meta,
    blocks: smartMerge(blocks)
  };
}

async function loadPages(bookId, count) {
  statusEl.textContent = `جلب ${count} صفحة من تراث...`;

  const r = await fetch(
    `/api/book/${bookId}/pages?from=1&to=${count}`
  );

  if (!r.ok) {
    throw new Error(`HTTP ${r.status}`);
  }

  const data = await r.json();

  if (!Array.isArray(data.pages) ||
      data.pages.length !== count) {
    throw new Error(
      `وصلت ${data.pages?.length || 0} صفحة بدل ${count}`
    );
  }

  return data.pages.map(parsePage);
}

function makeRun(text, heading = false) {
  return new docx.TextRun({
    text,
    font: "Traditional Arabic",
    rightToLeft: true,
    size: heading ? 34 : 28,   // 17pt / 14pt
    bold: heading
  });
}

function makeParagraph(block, firstOnPage) {
  return new docx.Paragraph({
    bidirectional: true,

    alignment:
      block.type === "heading"
        ? docx.AlignmentType.CENTER
        : docx.AlignmentType.JUSTIFIED,

    pageBreakBefore: firstOnPage,

    keepNext: false,
    keepLines: false,

    spacing: {
      before: 0,
      after: 0,
      line: 240,
      lineRule: "auto"
    },

    children: [
      makeRun(
        block.text,
        block.type === "heading"
      )
    ]
  });
}

function footerFor(vol, page) {
  return new docx.Footer({
    children: [
      new docx.Paragraph({
        bidirectional: true,
        alignment: docx.AlignmentType.CENTER,
        spacing: {
          before: 0,
          after: 0
        },
        children: [
          new docx.TextRun({
            text: `الجزء ${vol} | الصفحة ${page}`,
            font: "Traditional Arabic",
            rightToLeft: true,
            size: 20
          })
        ]
      })
    ]
  });
}

document.getElementById("make").onclick = async () => {
  try {
    const bookId = getBookId();

    const pages =
      await loadPages(bookId, PAGE_COUNT);

    statusEl.textContent =
      "بناء Word بنمط 1:1...";

    /*
      نستخدم Section لكل صفحة في اختبار الـ50.
      فائدته الآن:
      - حد الصفحة قطعي.
      - footer يأخذ meta.page الحقيقي من تراث.
      - لا نعتمد على تخمين ترقيم API.

      بعد نجاح 50/50 يمكننا تحسين بنية 2236 صفحة
      دون المساس بالتنسيق.
    */
    const sections = [];

    for (let i = 0; i < pages.length; i++) {
      const page = pages[i];

      let blocks = page.blocks;

      if (!blocks.length) {
        blocks = [{
          type: "paragraph",
          text: ""
        }];
      }

      const children = blocks.map(
        (block, j) =>
          makeParagraph(block, false)
      );

      sections.push({
        properties: {
          type:
            i === 0
              ? undefined
              : docx.SectionType.NEXT_PAGE,

          page: {
            size: {
              width: 11906,
              height: 16838
            },

            margin: {
              top: 794,       // 14 mm
              bottom: 794,    // 14 mm
              left: 907,      // 16 mm
              right: 907,     // 16 mm
              footer: 283     // 5 mm
            }
          }
        },

        footers: {
          default: footerFor(
            page.meta.vol,
            page.meta.page
          )
        },

        children
      });
    }

    const documentFile =
      new docx.Document({
        sections
      });

    statusEl.textContent =
      "ضغط DOCX...";

    const blob =
      await docx.Packer.toBlob(documentFile);

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    const safeName =
      (pages[0]?.meta?.book_name ||
       `book-${bookId}`)
      .replace(/[\\/:*?"<>|]/g, "-");

    a.href = url;
    a.download =
      `${safeName}-1to1-50.docx`;

    a.click();

    setTimeout(
      () => URL.revokeObjectURL(url),
      10000
    );

    const paragraphCount =
      pages.reduce(
        (n, p) => n + p.blocks.length,
        0
      );

    statusEl.textContent =
      `✓ تم إنشاء ${PAGE_COUNT} صفحة مصدر\n` +
      `الوضع: 1:1\n` +
      `الأجزاء: ${sections.length}\n` +
      `الفقرات: ${paragraphCount}\n` +
      `الحجم: ${(blob.size / 1024).toFixed(1)} KB`;

  } catch (error) {
    console.error(error);

    statusEl.textContent =
      "❌ فشل\n\n" +
      error.name +
      ": " +
      error.message;
  }
};

document.getElementById("diagnose").onclick = async () => {
  try {
    const bookId = getBookId();

    statusEl.textContent =
      "جلب صفحات التشخيص...";

    const pages =
      await loadPages(bookId, 50);

    const zip = new JSZip();

    for (let i = 0; i < pages.length; i++) {
      const page = pages[i];

      statusEl.textContent =
        `إنشاء ملف ${i + 1}/50...`;

      let blocks = page.blocks;

      if (!blocks.length) {
        blocks = [{
          type: "paragraph",
          text: ""
        }];
      }

      const children = blocks.map(
        block => makeParagraph(block, false)
      );

      /*
       * ملف مستقل تمامًا:
       * لا Sections سابقة،
       * لا NEXT_PAGE،
       * لا أثر لصفحة أخرى.
       */
      const d = new docx.Document({
        sections: [{
          properties: {
            page: {
              size: {
                width: 11906,
                height: 16838
              },
              margin: {
                top: 794,
                bottom: 794,
                left: 907,
                right: 907,
                footer: 283
              }
            }
          },

          footers: {
            default: footerFor(
              page.meta.vol,
              page.meta.page
            )
          },

          children
        }]
      });

      const blob =
        await docx.Packer.toBlob(d);

      const bytes =
        await blob.arrayBuffer();

      const n =
        String(i + 1).padStart(3, "0");

      const printed =
        String(page.meta.page)
          .padStart(3, "0");

      zip.file(
        `source-${n}_vol-${page.meta.vol}_page-${printed}.docx`,
        bytes
      );

      /*
       * ملف فهرس حتى نعرف الربط قطعًا.
       */
      zip.file(
        `source-${n}.txt`,
        [
          `internal source: ${i + 1}`,
          `volume: ${page.meta.vol}`,
          `printed page: ${page.meta.page}`,
          `blocks: ${page.blocks.length}`
        ].join("\n")
      );
    }

    statusEl.textContent =
      "ضغط ملفات التشخيص...";

    const zipBlob =
      await zip.generateAsync({
        type: "blob",
        compression: "DEFLATE",
        compressionOptions: {
          level: 6
        }
      });

    const url =
      URL.createObjectURL(zipBlob);

    const a =
      document.createElement("a");

    a.href = url;
    a.download =
      "turath-diagnostic-50.zip";

    a.click();

    setTimeout(
      () => URL.revokeObjectURL(url),
      10000
    );

    statusEl.textContent =
      "✓ تم إنشاء ZIP التشخيص\n" +
      "50 صفحة مصدر = 50 ملف Word مستقل";

  } catch (error) {
    console.error(error);

    statusEl.textContent =
      "❌ فشل التشخيص\n\n" +
      error.name + ": " +
      error.message;
  }
};

</script>

</body>
</html>
